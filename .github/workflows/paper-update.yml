name: Auto Update Minecraft Plugin

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate Bot Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Run Paper Bumper
        uses: Sqrilizz/paper-bumper@main
        with:
          project-dir: "server"
          software: "paper"
          channel: "STABLE"
          auto-pr: "true"
          smoke-test: "true"
          test-commands: "version,plugins,reports"
          github-token: ${{ steps.app_token.outputs.token }}
          author-name: ${{ format('{0}[bot]', steps.app_token.outputs.app-slug) }}
          author-email: ${{ format('{0}[bot]@users.noreply.github.com', steps.app_token.outputs.app-slug) }}
